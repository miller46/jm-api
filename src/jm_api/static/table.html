<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Detail</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="auth-header">
    <h1 id="table-title">Table Detail</h1>
    <div class="auth-controls">
      <span class="user-email" id="user-email"></span>
      <button class="btn-logout" id="logout-btn">Logout</button>
    </div>
  </header>

  <main>
    <div class="dashboard-actions">
      <a href="index.html" class="btn btn-secondary">&larr; Back to dashboard</a>
      <a id="add-record-btn" href="" class="btn btn-primary">Add Record</a>
    </div>

    <details id="column-toggle">
      <summary>Columns</summary>
      <div id="column-checkboxes"></div>
    </details>

    <details id="filter-toggle">
      <summary>Filters</summary>
      <div id="filter-inputs"></div>
    </details>

    <div id="loading" class="loading">Loading...</div>
    <div id="error" class="error" style="display:none;"></div>

    <div class="table-wrapper">
      <div class="table-scroll-container">
        <table id="data-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    // Setup logout button and user info
    document.addEventListener('DOMContentLoaded', function() {
      var logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', function() {
          Auth.logout();
        });
      }
      
      Auth.getCurrentUser().then(function(user) {
        var emailEl = document.getElementById('user-email');
        if (emailEl && user) {
          emailEl.textContent = user.email;
        }
      });
    });
  </script>
</body>
</html>
