<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .signup-container {
      max-width: 400px;
      margin: 3rem auto;
      padding: 2rem;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .signup-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .signup-header h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.75rem;
      color: #333;
    }

    .signup-header p {
      margin: 0;
      color: #666;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #333;
      font-size: 0.95rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      box-sizing: border-box;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
    }

    .form-group input.error {
      border-color: #dc3545;
      box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.15);
    }

    .field-error {
      color: #dc3545;
      font-size: 0.85rem;
      margin-top: 0.25rem;
      display: none;
    }

    .field-error.visible {
      display: block;
    }

    .password-strength {
      margin-top: 0.5rem;
      height: 4px;
      background: #e9ecef;
      border-radius: 2px;
      overflow: hidden;
    }

    .password-strength-bar {
      height: 100%;
      width: 0;
      transition: width 0.3s, background-color 0.3s;
    }

    .password-strength-bar.weak {
      width: 33%;
      background: #dc3545;
    }

    .password-strength-bar.medium {
      width: 66%;
      background: #ffc107;
    }

    .password-strength-bar.strong {
      width: 100%;
      background: #28a745;
    }

    .password-strength-text {
      font-size: 0.8rem;
      margin-top: 0.25rem;
      color: #666;
    }

    .btn-signup {
      width: 100%;
      padding: 0.875rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #0d6efd;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-signup:hover:not(:disabled) {
      background: #0b5ed7;
    }

    .btn-signup:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }

    .btn-signup.loading {
      position: relative;
      color: transparent;
    }

    .btn-signup.loading::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      top: 50%;
      left: 50%;
      margin-left: -10px;
      margin-top: -10px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spinner 0.8s linear infinite;
    }

    @keyframes spinner {
      to { transform: rotate(360deg); }
    }

    .signup-footer {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #dee2e6;
    }

    .signup-footer p {
      margin: 0;
      color: #666;
      font-size: 0.95rem;
    }

    .signup-footer a {
      color: #0d6efd;
      text-decoration: none;
      font-weight: 500;
    }

    .signup-footer a:hover {
      text-decoration: underline;
    }

    .toast-container {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 1000;
    }

    .toast {
      padding: 1rem 1.25rem;
      margin-bottom: 0.5rem;
      border-radius: 4px;
      color: #fff;
      font-size: 0.95rem;
      max-width: 350px;
      animation: slideIn 0.3s ease-out;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .toast.success {
      background: #28a745;
    }

    .toast.error {
      background: #dc3545;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @media (max-width: 480px) {
      .signup-container {
        margin: 1rem;
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <div class="signup-header">
      <h1>Create Account</h1>
      <p>Sign up to access the admin dashboard</p>
    </div>

    <form id="signup-form" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
          autocomplete="email"
        >
        <span class="field-error" id="email-error">Please enter a valid email address</span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
          autocomplete="new-password"
          minlength="8"
        >
        <div class="password-strength">
          <div class="password-strength-bar" id="password-strength-bar"></div>
        </div>
        <div class="password-strength-text" id="password-strength-text"></div>
        <span class="field-error" id="password-error">
          Password must be at least 8 characters with uppercase, lowercase, and number
        </span>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input
          type="password"
          id="confirm-password"
          name="confirm-password"
          placeholder="Confirm your password"
          required
          autocomplete="new-password"
        >
        <span class="field-error" id="confirm-password-error">Passwords do not match</span>
      </div>

      <button type="submit" class="btn-signup" id="submit-btn">Create Account</button>
    </form>

    <div class="signup-footer">
      <p>Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="signup.js"></script>
</body>
</html>
