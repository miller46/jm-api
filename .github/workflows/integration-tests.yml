name: Integration Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      JM_API_JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then
            uv sync --dev
          else
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt
            fi
            pip install -e ".[dev]"
          fi

      - name: Validate Alembic migrations
        run: |
          export JM_API_DATABASE_URL="sqlite:///./ci_migrations.db"
          if [ -f uv.lock ]; then
            uv run alembic upgrade head
            uv run alembic check
          else
            alembic upgrade head
            alembic check
          fi

      - name: Run integration tests
        run: |
          mkdir -p test-results
          if [ -f uv.lock ]; then
            uv run pytest -m integration tests/integration --junitxml=test-results/pytest-integration.xml
          else
            pytest -m integration tests/integration --junitxml=test-results/pytest-integration.xml
          fi

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/
