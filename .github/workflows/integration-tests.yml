name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then
            uv sync --dev
          else
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt
            fi
            pip install -e ".[dev]"
          fi

      - name: Lint (ruff)
        run: |
          if [ -f uv.lock ]; then
            uv run ruff check .
          else
            ruff check .
          fi

      - name: Type check (mypy)
        run: |
          if [ -f uv.lock ]; then
            uv run mypy
          else
            mypy
          fi

      - name: Security scan (bandit)
        run: |
          if [ -f uv.lock ]; then
            uv run bandit -q -r src -s B105,B106,B311
          else
            bandit -q -r src -s B105,B106,B311
          fi

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          if [ -f requirements.txt ]; then
            if [ -f uv.lock ]; then
              uv run pip-audit -r requirements.txt --no-deps --disable-pip
            else
              pip-audit -r requirements.txt --no-deps --disable-pip
            fi
          else
            if [ -f uv.lock ]; then
              uv run pip-audit
            else
              pip-audit
            fi
          fi

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-gates

    env:
      JM_API_JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JM_API_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      CI: true

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then
            uv sync --dev
          else
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt
            fi
            pip install -e ".[dev]"
          fi

      - name: Validate Alembic migrations
        run: |
          if [ -f uv.lock ]; then
            uv run alembic upgrade head
            uv run alembic check
          else
            alembic upgrade head
            alembic check
          fi

      - name: Run integration tests
        run: |
          mkdir -p test-results
          if [ -f uv.lock ]; then
            uv run pytest -m integration tests/integration --junitxml=test-results/pytest-integration.xml
          else
            pytest -m integration tests/integration --junitxml=test-results/pytest-integration.xml
          fi

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/
