name: Integration Tests

on:
  pull_request:
    branches:
      - main

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jm_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jm_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JM_API_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/jm_api_test
      JM_API_JWT_SECRET_KEY: test-jwt-secret-for-ci-only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then
            uv sync --dev
          else
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt
            fi
            pip install -e ".[dev]"
          fi

      - name: Run integration tests
        run: |
          mkdir -p test-results
          if [ -f uv.lock ]; then
            uv run pytest -m integration tests/integration --junitxml=test-results/pytest-integration.xml
          else
            pytest -m integration tests/integration --junitxml=test-results/pytest-integration.xml
          fi

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/
