name: CD

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Deploy
        run: |
          git push https://heroku:${{ secrets.HEROKU_API_KEY }}@git.heroku.com/${{ secrets.HEROKU_APP_NAME }}.git HEAD:main

      - name: Verify deployment health
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30
          
          # Use production base URL from repository variables
          HEALTH_URL="${{ vars.PRODUCTION_BASE_URL }}/api/v1/health"
          
          echo "Checking health endpoint: ${HEALTH_URL}"
          
          # Attempt health check with retries
          for i in {1..5}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${HEALTH_URL}" || echo "000")
            if [ "${HTTP_STATUS}" = "200" ]; then
              echo "✅ Health check passed (HTTP ${HTTP_STATUS})"
              exit 0
            fi
            echo "Attempt ${i}/5: Health check returned HTTP ${HTTP_STATUS}, retrying in 10s..."
            sleep 10
          done
          
          echo "❌ Health check failed after 5 attempts"
          exit 1

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "🚀 Deployment to Heroku completed successfully!"
          else
            echo "❌ Deployment to Heroku failed"
          fi
