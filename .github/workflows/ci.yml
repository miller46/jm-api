name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          go build ./cmd/api
          go build ./cmd/worker

      - name: Unit tests
        run: go test ./... -count=1 -race

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-gates

    env:
      JM_API_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db?sslmode=disable
      JM_API_JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JM_API_ENVIRONMENT: development
      CI: true

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Install migrate CLI
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate

      - name: Run database migrations
        run: migrate -path internal/db/migrate -database "$JM_API_DATABASE_URL" up

      - name: Run integration tests
        run: |
          mkdir -p test-results
          go test ./... -count=1 -race -v -tags integration 2>&1 | tee test-results/test-output.txt

      - name: Run chaos tests (optional)
        continue-on-error: true
        run: |
          mkdir -p test-results
          go test ./internal/integration -count=1 -v -tags integration -run "RedisUnavailable|GracefulDegradation" 2>&1 | tee test-results/chaos-test-output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/
