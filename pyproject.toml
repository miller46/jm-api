[project]
name = "jm-api"
version = "0.1.0"
description = "JM API service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.110",
  "psycopg2-binary>=2.9",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "gunicorn>=22.0",
  "uvicorn[standard]>=0.27",
  "bcrypt>=4.0",
  "pyjwt>=2.8",
  "slowapi>=0.1.9",
  "email-validator>=2.3.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-jaeger-thrift>=1.21.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.3",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[tool.pytest.ini_options]
markers = ["integration: full-stack integration tests (start real server)"]
addopts = "-q -m 'not integration'"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_optional = true
disable_error_code = ["arg-type", "attr-defined", "call-arg", "list-item", "return-value", "valid-type"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "ruff>=0.12.10",
    "mypy>=1.18.2",
    "bandit>=1.8.6",
    "pip-audit>=2.9.0",
]
