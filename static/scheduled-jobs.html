<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduled Jobs Calendar</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Calendar-specific styles */
    .calendar-container {
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 1.5rem;
      margin-top: 1rem;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .calendar-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
    }

    .calendar-nav {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: #dee2e6;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      overflow: hidden;
    }

    .calendar-day-header {
      background: #e9ecef;
      padding: 0.75rem 0.5rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.875rem;
    }

    .calendar-day {
      background: #fff;
      min-height: 100px;
      padding: 0.5rem;
      position: relative;
    }

    .calendar-day.other-month {
      background: #f8f9fa;
      color: #6c757d;
    }

    .calendar-day.today {
      background: #e7f3ff;
    }

    .calendar-day-number {
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .calendar-jobs {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .calendar-job {
      padding: 0.25rem 0.5rem;
      border-radius: 3px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity 0.15s;
    }

    .calendar-job:hover {
      opacity: 0.8;
    }

    .calendar-job.enabled {
      background: #d4edda;
      color: #155724;
      border-left: 3px solid #28a745;
    }

    .calendar-job.disabled {
      background: #f8d7da;
      color: #721c24;
      border-left: 3px solid #dc3545;
    }

    .calendar-job.failed {
      background: #fff3cd;
      color: #856404;
      border-left: 3px solid #ffc107;
    }

    /* Tooltip */
    .job-tooltip {
      position: absolute;
      background: #333;
      color: #fff;
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      font-size: 0.875rem;
      z-index: 1000;
      max-width: 250px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .job-tooltip.visible {
      opacity: 1;
    }

    .job-tooltip-title {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .job-tooltip-time {
      font-size: 0.8rem;
      color: #adb5bd;
    }

    /* Filters panel */
    .filters-panel {
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .filters-row {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .filter-group label {
      font-weight: 500;
      font-size: 0.9rem;
    }

    .filter-group input[type="text"] {
      padding: 0.375rem 0.75rem;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .filter-group input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
    }

    .filter-group select {
      padding: 0.375rem 0.75rem;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    /* Legend */
    .calendar-legend {
      display: flex;
      gap: 1.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }

    .legend-dot.enabled { background: #28a745; }
    .legend-dot.disabled { background: #dc3545; }
    .legend-dot.failed { background: #ffc107; }

    /* Actions bar */
    .actions-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    /* Modal styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }

    .modal-overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: #fff;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .modal-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #dee2e6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      margin: 0;
      font-size: 1.25rem;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #6c757d;
    }

    .modal-close:hover {
      color: #333;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid #dee2e6;
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: #6c757d;
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    /* Skeleton loader */
    .skeleton-calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: #dee2e6;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      overflow: hidden;
    }

    .skeleton-day {
      background: #fff;
      min-height: 100px;
      padding: 0.5rem;
    }

    .skeleton-day-header {
      background: #e9ecef;
      padding: 0.75rem 0.5rem;
    }

    .skeleton-line {
      height: 12px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 2px;
      margin-bottom: 0.5rem;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Cron Builder Styles */
    .cron-form-group {
      background: #f8f9fa;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #e9ecef;
    }

    .cron-builder {
      margin-top: 0.75rem;
    }

    .cron-tabs {
      display: flex;
      gap: 0.25rem;
      margin-bottom: 1rem;
      border-bottom: 2px solid #dee2e6;
    }

    .cron-tab {
      padding: 0.5rem 1rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      cursor: pointer;
      font-size: 0.9rem;
      color: #6c757d;
      transition: all 0.15s;
    }

    .cron-tab:hover {
      color: #0d6efd;
    }

    .cron-tab.active {
      color: #0d6efd;
      border-bottom-color: #0d6efd;
      font-weight: 500;
    }

    .cron-tab-panel {
      display: none;
    }

    .cron-tab-panel.active {
      display: block;
    }

    .cron-presets {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.5rem;
    }

    .cron-preset-btn {
      padding: 0.625rem 0.75rem;
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: left;
      transition: all 0.15s;
    }

    .cron-preset-btn:hover {
      background: #e7f3ff;
      border-color: #0d6efd;
      color: #0d6efd;
    }

    .cron-preset-btn.active {
      background: #0d6efd;
      border-color: #0d6efd;
      color: #fff;
    }

    .cron-custom-fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.75rem;
    }

    .cron-field {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .cron-field label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #495057;
      text-transform: uppercase;
      letter-spacing: 0.025em;
    }

    .cron-field select {
      padding: 0.5rem;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.9rem;
      background: #fff;
      cursor: pointer;
    }

    .cron-field select:focus {
      outline: none;
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
    }

    .cron-preview {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #fff;
      border-radius: 6px;
      border-left: 4px solid #28a745;
    }

    .cron-preview.invalid {
      border-left-color: #dc3545;
    }

    .cron-preview-status {
      font-size: 0.8rem;
      margin-bottom: 0.25rem;
    }

    .cron-valid {
      color: #28a745;
      font-weight: 500;
    }

    .cron-invalid {
      color: #dc3545;
      font-weight: 500;
    }

    .cron-human-readable {
      font-size: 1rem;
      font-weight: 600;
      color: #333;
    }

    /* Modal improvements for spacing */
    .modal {
      max-width: 600px;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .calendar-day {
        min-height: 60px;
        padding: 0.25rem;
      }

      .calendar-job {
        font-size: 0.65rem;
        padding: 0.125rem 0.25rem;
      }

      .calendar-day-header {
        font-size: 0.75rem;
        padding: 0.5rem 0.25rem;
      }

      .cron-presets {
        grid-template-columns: 1fr;
      }

      .cron-custom-fields {
        grid-template-columns: 1fr 1fr;
      }

      .modal {
        width: 95%;
        margin: 1rem;
      }
    }
  </style>
</head>
<body>
  <header class="auth-header">
    <h1>Scheduled Jobs Calendar</h1>
    <div class="auth-controls">
      <span class="user-email" id="user-email"></span>
      <button class="btn-logout" id="logout-btn">Logout</button>
    </div>
  </header>

  <main>
    <div class="dashboard-actions">
      <a href="index.html" class="btn btn-secondary">← Back to dashboard</a>
      <button id="new-job-btn" class="btn btn-primary">+ New Job</button>
      <button id="refresh-btn" class="btn btn-secondary">↻ Refresh</button>
    </div>

    <div class="filters-panel">
      <div class="filters-row">
        <div class="filter-group">
          <label for="search-input">Search:</label>
          <input type="text" id="search-input" placeholder="Filter by name...">
        </div>
        <div class="filter-group">
          <label for="status-filter">Status:</label>
          <select id="status-filter">
            <option value="all">All</option>
            <option value="enabled">Enabled</option>
            <option value="disabled">Disabled</option>
            <option value="failed">Failed</option>
          </select>
        </div>
        <div class="filter-group">
          <input type="checkbox" id="hide-disabled" checked>
          <label for="hide-disabled">Hide disabled jobs</label>
        </div>
      </div>
    </div>

    <div id="loading" class="loading" style="display: none;">Loading...</div>
    <div id="error" class="error" style="display:none;"></div>

    <div id="calendar-container" class="calendar-container">
      <div class="calendar-header">
        <h2 id="calendar-title" class="calendar-title">March 2025</h2>
        <div class="calendar-nav">
          <button id="prev-month" class="btn btn-secondary">‹ Prev</button>
          <button id="today-btn" class="btn btn-secondary">Today</button>
          <button id="next-month" class="btn btn-secondary">Next ›</button>
        </div>
      </div>

      <div id="calendar-grid" class="calendar-grid">
        <!-- Calendar will be rendered here -->
      </div>

      <div class="calendar-legend">
        <div class="legend-item">
          <div class="legend-dot enabled"></div>
          <span>Enabled</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot disabled"></div>
          <span>Disabled</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot failed"></div>
          <span>Has Failures</span>
        </div>
      </div>
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
      <div class="empty-state-icon">🗓️</div>
      <h3>No scheduled jobs yet</h3>
      <p>Create your first job to see it on the calendar.</p>
      <button id="empty-create-btn" class="btn btn-primary">Create First Job</button>
    </div>
  </main>

  <!-- Tooltip -->
  <div id="job-tooltip" class="job-tooltip">
    <div class="job-tooltip-title"></div>
    <div class="job-tooltip-time"></div>
  </div>

  <!-- Job Modal -->
  <div id="job-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">Job Details</h3>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      <div class="modal-body">
        <form id="job-form">
          <div class="form-group">
            <label for="job-name">Name *</label>
            <input type="text" id="job-name" name="name" required>
          </div>
          <div class="form-group">
            <label for="job-description">Description</label>
            <input type="text" id="job-description" name="description">
          </div>
          <div class="form-group">
            <label for="job-type">Job Type *</label>
            <input type="text" id="job-type" name="job_type" required>
          </div>
          <div class="form-group cron-form-group">
            <label for="job-cron">Schedule (Cron) *</label>
            <input type="text" id="job-cron" name="cron_expression" placeholder="0 0 * * *" required>
            
            <!-- Cron Builder -->
            <div class="cron-builder">
              <div class="cron-tabs">
                <button type="button" class="cron-tab active" data-tab="preset">Presets</button>
                <button type="button" class="cron-tab" data-tab="custom">Custom</button>
              </div>
              
              <!-- Preset Tab -->
              <div class="cron-tab-panel active" data-panel="preset">
                <div class="cron-presets">
                  <button type="button" class="cron-preset-btn" data-cron="*/5 * * * *">Every 5 minutes</button>
                  <button type="button" class="cron-preset-btn" data-cron="0 * * * *">Every hour</button>
                  <button type="button" class="cron-preset-btn" data-cron="0 0 * * *">Daily at midnight</button>
                  <button type="button" class="cron-preset-btn" data-cron="0 9 * * 1">Every Monday at 9 AM</button>
                  <button type="button" class="cron-preset-btn" data-cron="0 0 * * 0">Every Sunday at midnight</button>
                  <button type="button" class="cron-preset-btn" data-cron="0 0 1 * *">First day of month</button>
                </div>
              </div>
              
              <!-- Custom Tab -->
              <div class="cron-tab-panel" data-panel="custom">
                <div class="cron-custom-fields">
                  <div class="cron-field">
                    <label for="cron-minute">Minute</label>
                    <select id="cron-minute">
                      <option value="*">Every minute</option>
                      <option value="0">0</option>
                      <option value="5">5</option>
                      <option value="10">10</option>
                      <option value="15">15</option>
                      <option value="20">20</option>
                      <option value="25">25</option>
                      <option value="30">30</option>
                      <option value="35">35</option>
                      <option value="40">40</option>
                      <option value="45">45</option>
                      <option value="50">50</option>
                      <option value="55">55</option>
                    </select>
                  </div>
                  <div class="cron-field">
                    <label for="cron-hour">Hour</label>
                    <select id="cron-hour">
                      <option value="*">Every hour</option>
                      <option value="0">12 AM (0)</option>
                      <option value="1">1 AM</option>
                      <option value="2">2 AM</option>
                      <option value="3">3 AM</option>
                      <option value="4">4 AM</option>
                      <option value="5">5 AM</option>
                      <option value="6">6 AM</option>
                      <option value="7">7 AM</option>
                      <option value="8">8 AM</option>
                      <option value="9">9 AM</option>
                      <option value="10">10 AM</option>
                      <option value="11">11 AM</option>
                      <option value="12">12 PM</option>
                      <option value="13">1 PM</option>
                      <option value="14">2 PM</option>
                      <option value="15">3 PM</option>
                      <option value="16">4 PM</option>
                      <option value="17">5 PM</option>
                      <option value="18">6 PM</option>
                      <option value="19">7 PM</option>
                      <option value="20">8 PM</option>
                      <option value="21">9 PM</option>
                      <option value="22">10 PM</option>
                      <option value="23">11 PM</option>
                    </select>
                  </div>
                  <div class="cron-field">
                    <label for="cron-day">Day of Month</label>
                    <select id="cron-day">
                      <option value="*">Every day</option>
                      <option value="1">1st</option>
                      <option value="2">2nd</option>
                      <option value="3">3rd</option>
                      <option value="5">5th</option>
                      <option value="10">10th</option>
                      <option value="15">15th</option>
                      <option value="20">20th</option>
                      <option value="25">25th</option>
                      <option value="28">28th</option>
                      <option value="31">31st</option>
                    </select>
                  </div>
                  <div class="cron-field">
                    <label for="cron-month">Month</label>
                    <select id="cron-month">
                      <option value="*">Every month</option>
                      <option value="1">January</option>
                      <option value="2">February</option>
                      <option value="3">March</option>
                      <option value="4">April</option>
                      <option value="5">May</option>
                      <option value="6">June</option>
                      <option value="7">July</option>
                      <option value="8">August</option>
                      <option value="9">September</option>
                      <option value="10">October</option>
                      <option value="11">November</option>
                      <option value="12">December</option>
                    </select>
                  </div>
                  <div class="cron-field">
                    <label for="cron-dow">Day of Week</label>
                    <select id="cron-dow">
                      <option value="*">Every day</option>
                      <option value="0">Sunday</option>
                      <option value="1">Monday</option>
                      <option value="2">Tuesday</option>
                      <option value="3">Wednesday</option>
                      <option value="4">Thursday</option>
                      <option value="5">Friday</option>
                      <option value="6">Saturday</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
            
            <!-- Cron Preview -->
            <div id="cron-preview" class="cron-preview">
              <div class="cron-preview-status">
                <span id="cron-validity" class="cron-valid">✓ Valid cron expression</span>
              </div>
              <div id="cron-human-readable" class="cron-human-readable">Every minute</div>
            </div>
          </div>
          <div class="form-group">
            <label for="job-next-run">Next Run At</label>
            <input type="datetime-local" id="job-next-run" name="next_run_at">
          </div>
          <div class="form-group">
            <label>
              <input type="checkbox" id="job-enabled" name="enabled" checked>
              Enabled
            </label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
        <button id="modal-save" class="btn btn-primary">Save</button>
        <button id="modal-delete" class="btn btn-danger" style="display: none;">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="scheduled-jobs.js"></script>
</body>
</html>
